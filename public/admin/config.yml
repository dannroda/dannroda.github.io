# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Online: "Sign In with Token" with a GitHub fine-grained token (Contents: read/write on this repo).
# Local: `npm run dev`, open http://localhost:4321/admin/index.html in a Chromium browser, "Work with Local Repository".

backend:
  name: github
  repo: dannroda/dannroda.github.io
  branch: main
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload "{{path}}"'
    deleteMedia: 'content: delete "{{path}}"'

media_folder: /public/media
public_folder: /media

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    i18n: true
    slug: '{{slug}}'
    sortable_fields: [date, title]
    summary: '{{title}} · {{date | date("YYYY-MM-DD")}}'
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: date, label: Fecha, widget: datetime, i18n: duplicate, default: '{{now}}' }
      - { name: description, label: Bajada, widget: text, i18n: true, required: false }
      - { name: tags, label: Tags, widget: list, i18n: duplicate, required: false }
      - { name: draft, label: Borrador, widget: boolean, i18n: duplicate, default: false }
      - { name: body, label: Texto, widget: markdown, i18n: true }

  # Served at /<lang>/<slug>/; blog, games, wiki and links are taken.
  - name: pages
    label: Páginas
    label_singular: Página
    folder: content/pages
    create: true
    i18n: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: description, label: Bajada, widget: text, i18n: true, required: false }
      - { name: project, label: Proyecto, widget: string, i18n: duplicate, required: false, hint: 'Opcional. El nombre del archivo del juego o proyecto (por ejemplo godot-dojo); su ficha linkea a esta página.' }
      - { name: draft, label: Borrador, widget: boolean, i18n: duplicate, default: false }
      - { name: body, label: Texto, widget: markdown, i18n: true }

  # One file per game, created by the store sync; store data itself lives in content/store/ and is not editable here.
  - name: games
    label: Juegos y proyectos
    label_singular: Juego o proyecto
    folder: content/games
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: ai
    summary: '{{filename}}'
    fields:
      - name: ai
        label: Uso de IA
        widget: select
        required: false
        options:
          - { label: Hecho a mano, value: hand }
          - { label: Asistido por IA, value: assisted }
          - { label: Vibe-coded, value: vibe }
      - { name: featured, label: Destacado, widget: boolean, default: false }
      - { name: hidden, label: Oculto, widget: boolean, default: false }
      - name: landing
        label: Landing page
        widget: string
        required: false
        hint: 'Opcional. Una página del sitio sin el idioma (por ejemplo godot-agent, que abre /es/godot-agent/ o /en/godot-agent/) o un link completo https://…; la ficha muestra «Página del proyecto».'
        pattern: ['^\s*(https://\S+|[a-z0-9][a-z0-9/-]*)\s*$', 'Un nombre de página como godot-agent, o un link que empiece con https://']
      - name: role
        label: Mi rol
        widget: object
        fields:
          - { name: es, label: Español, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
      - name: summary
        label: Texto propio (reemplaza el de la tienda)
        widget: object
        fields:
          - { name: es, label: Español, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
      - name: authorship
        label: Quién hizo qué
        label_singular: Área
        widget: list
        required: false
        summary: '{{fields.area}}: {{fields.who}}'
        fields:
          - name: area
            label: Área
            widget: select
            options:
              - { label: Diseño, value: design }
              - { label: Código, value: code }
              - { label: Arte, value: art }
              - { label: Audio, value: audio }
              - { label: Escritura, value: writing }
              - { label: Herramientas, value: tools }
              - { label: Depuración, value: debugging }
          - name: who
            label: Autoría
            widget: select
            options:
              - { label: Yo, value: me }
              - { label: IA + revisión, value: ai }
              - { label: Equipo, value: team }
              - { label: Terceros, value: third }
          - name: note
            label: Nota
            widget: object
            fields:
              - { name: es, label: Español, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }

  - name: settings
    label: Sitio
    files:
      # Read by scripts/sync-games.mjs on every deploy: adding fetches the data, removing takes it off the site.
      - name: sources
        label: Juegos y proyectos (fuentes)
        file: content/sources.json
        fields:
          - name: steam
            label: Steam
            label_singular: Juego en Steam
            widget: list
            required: false
            hint: Link de la página de la tienda (o solo el número de la app).
            field:
              name: url
              label: Link
              widget: string
              pattern: ['^\s*(\d+|https://store\.steampowered\.com/app/\d+\S*)\s*$', 'Un link de store.steampowered.com/app/… o el número de la app']
          - name: itch
            label: itch.io
            label_singular: Juego en itch.io
            widget: list
            required: false
            hint: Link del juego, de tu cuenta o de la de otro autor.
            summary: '{{fields.url}}'
            fields:
              - name: url
                label: Link
                widget: string
                pattern: ['^\s*https://[\w-]+\.itch\.io/[\w-]+/?\s*$', 'Un link de la forma https://usuario.itch.io/juego']
              - name: repo
                label: Código en GitHub
                widget: string
                required: false
                hint: Opcional, si el código es público. Link del repo (o usuario/repo); la ficha lo linkea y, si el repo también está en GitHub, no se repite en Proyectos.
                pattern: ['^\s*(https://github\.com/)?[\w.-]+/[\w.-]+/?\s*$', 'Un link de github.com/usuario/repo']
          - name: github
            label: GitHub
            label_singular: Repositorio
            widget: list
            required: false
            hint: Link del repositorio (o usuario/repo). Aparece en Proyectos; si el README tiene imágenes, la primera es la portada. Un repo privado no aparece; se publica en el primer deploy después de hacerlo público.
            field:
              name: url
              label: Link
              widget: string
              pattern: ['^\s*(https://github\.com/)?[\w.-]+/[\w.-]+/?\s*$', 'Un link de github.com/usuario/repo']
          - name: assetlib
            label: Godot Asset Library
            label_singular: Asset
            widget: list
            required: false
            hint: Link del asset (o solo su número). Aparece en Proyectos.
            field:
              name: url
              label: Link
              widget: string
              pattern: ['^\s*(\d+|https://godotengine\.org/asset-library/asset/\d+\S*)\s*$', 'Un link de godotengine.org/asset-library/asset/… o el número del asset']
          - name: wikis
            label: Wikis (desde un repo)
            label_singular: Wiki
            widget: list
            required: false
            hint: 'usuario/repo usa su carpeta docs/; para otra carpeta, pegá su link (github.com/usuario/repo/tree/main/carpeta). Se publica en /wiki/<repo>/ y la ficha del proyecto con ese repo la linkea.'
            field:
              name: url
              label: Repo o carpeta
              widget: string
              pattern: ['^\s*(https://github\.com/)?[\w.-]+/[\w.-]+(/tree/\S+)?/?\s*$', 'usuario/repo o un link de github.com/usuario/repo/tree/…']
      - name: profile
        label: Links
        file: content/profile.json
        fields:
          - name: links
            label: Links
            label_singular: Link
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Texto, widget: string }
              - { name: url, label: URL, widget: string }
