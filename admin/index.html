<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dann · admin</title>
<style>
	:root {
		--bg: #0e0f12; --surface: #16181d; --surface-2: #1b1d23; --surface-3: #2a2d35;
		--ink: #f2f2ee; --muted: #b4b7be; --accent: #d7f25c; --accent-ink: #0e0f12; --danger: #f27a6b; --warn: #f2c25c;

	* { box-sizing: border-box; }

	input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	textarea { resize: vertical; min-height: 5em; }
	textarea.body { min-height: 24em; font: 14px/1.6 'JetBrains Mono', ui-monospace, monospace; }
	button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 14px; background: var(--surface-3); }
	button:hover { filter: brightness(1.15); }

	button.link { background: none; padding: 0; color: var(--accent); text-decoration: underline; text-align: left; }

	/* --nav-w / --list-w: the side columns, narrowed or hidden by their collapse buttons */
	.app { --nav-w: 200px; --list-w: 300px; display: grid; grid-template-columns: var(--nav-w) var(--list-w) minmax(0, 1fr); height: 100vh; }
	.app.nav-min { --nav-w: 56px; }

	/* Page editor: blocks as cards, opened one at a time */

	.blks:hover .blk-add, .blk-add:focus-visible { opacity: 1; }

	.blk-add.end { opacity: 1; height: auto; padding: 10px; margin-top: 8px; width: 100%; border: 1px dashed var(--surface-3); border-radius: 8px; color: var(--ink); }
	.img-field { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; }
	.img-field img, .img-field .ph { width: 120px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; flex: none; background: repeating-conic-gradient(#2a2d35 0 25%, #1b1d23 0 50%) 0 0 / 16px 16px; }
	.img-field .ph { display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
	.list-field { gap: 10px; }
	.list-item { display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 6px; background: var(--surface-2); }
	.list-item .bar button { padding: 4px 8px; }
	details.settings { border: 1px solid var(--surface-3); border-radius: 8px; padding: 10px 14px; }
	details.settings[open] { display: flex; flex-direction: column; gap: 14px; }
	details.settings summary { cursor: pointer; font-weight: 600; }
	.blocks-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
	.block-pick { padding: 12px; gap: 6px; white-space: normal; }
	.block-pick strong { font-size: 14px; }
	.block-pick .hint { white-space: normal; overflow: visible; }
	.dirty::after { content: ' ●'; color: var(--warn); }
	@media (max-width: 900px) {
		.app, .app.preview, .app.full { grid-template-columns: 1fr; height: auto; }
		.grip, .pane-full { display: none; }
		nav { flex-direction: row; flex-wrap: wrap; } nav .grow { display: none; }
		.list-toggle, .nav-collapse { display: none; }
		.app.list-min > .list { visibility: visible; }
		.list { border-right: 0; max-height: 40vh; }
		.preview-pane { height: 70vh; }
		.two, .row, .row.link { grid-template-columns: 1fr; }
	}
</style>

<body>
<div class="app" id="app"></div>
<script>
const TOKEN = '__TOKEN__';
const LANGS = { es: 'Español', en: 'English' };
const AI = [['', 'Sin definir'], ['hand', 'Hecho a mano'], ['assisted', 'Asistido por IA'], ['vibe', 'Vibe-coded']];
const SHOW = [['listed', 'En su lista'], ['featured', 'Destacado'], ['hidden', 'Oculto']];
const AREAS = [['design', 'Diseño'], ['code', 'Código'], ['art', 'Arte'], ['audio', 'Audio'], ['writing', 'Escritura'], ['tools', 'Herramientas'], ['debugging', 'Depuración']];
const WHO = [['me', 'Yo'], ['ai', 'IA + revisión'], ['team', 'Equipo'], ['third', 'Terceros']];
const STORES = { steam: 'Steam', itch: 'itch.io', github: 'GitHub', assetlib: 'Asset Library' };

// The same reading of links as scripts/sync-games.mjs, to tie each source entry to its synced game.
const steamId = (v) => Number(String(v).match(/(?:app\/)?(\d+)/)?.[1]);
const itchUrl = (v) => String(v).trim().replace(/\/$/, '');
const githubRepo = (v) => String(v).trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
const assetId = (v) => Number(String(v).match(/(?:asset\/)?(\d+)/)?.[1]);
const matches = {
	steam: (e, g) => steamId(e) === g.id,
	itch: (e, g) => itchUrl(e.url ?? e) === g.url,
	github: (e, g) => `https://github.com/${githubRepo(e)}`.toLowerCase() === g.url.toLowerCase(),
	assetlib: (e, g) => assetId(e) === g.id
};
// A pasted link -> which store list it goes in, or null.
function detect(link) {
	const v = link.trim();
	if (/^https:\/\/store\.steampowered\.com\/app\/\d+/.test(v)) return ['steam', v];
	if (/^https:\/\/[\w-]+\.itch\.io\/[\w-]+\/?$/.test(v)) return ['itch', { url: itchUrl(v), repo: '' }];
	if (/^https:\/\/godotengine\.org\/asset-library\/asset\/\d+/.test(v)) return ['assetlib', v];
	if (/^(https:\/\/github\.com\/)?[\w.-]+\/[\w.-]+\/?$/.test(v)) return ['github', githubRepo(v)];
	return null;
}

let S; // everything the server read from disk
let view = 'games', sel = null, lang = (() => { try { return localStorage.getItem('lang') === 'en' ? 'en' : 'es'; } catch { return 'es'; } })(), draft = null, dirty = false, preview = (() => { try { return JSON.parse(localStorage.getItem('preview')) ?? innerWidth > 1300; } catch { return innerWidth > 1300; } })(), busy = '', lastLog = '';
const $ = (q) => document.querySelector(q);
const clone = (v) => JSON.parse(JSON.stringify(v));
// "Página de prueba" -> "pagina-de-prueba": accents dropped, not turned into dashes.
const slugify = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const today = () => new Date().toLocaleDateString('sv'); // local YYYY-MM-DD, not UTC

// h('tag.class', {attrs, on*: handler}, ...children)
function h(sel, attrs = {}, ...kids) {
	const [tag, ...cls] = sel.split('.');
	const el = document.createElement(tag || 'div');
	if (cls.length) el.className = cls.join(' ');
	for (const [k, v] of Object.entries(attrs ?? {})) {
		if (v === false || v == null) continue;
		if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else if (k in el && k !== 'list') el[k] = v;
		else el.setAttribute(k, v === true ? '' : v);
	}
	el.append(...kids.flat(Infinity).filter((k) => k != null && k !== false));
	return el;
}

async function api(method, path, body) {
	const res = await fetch(`/api/${path}`, { method, headers: { 'x-admin-token': TOKEN, 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
	const out = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(out.error || res.statusText);
	return out;
}
function toast(msg, err) {
	const t = h('div.toast' + (err ? '.err' : ''), { role: 'status' }, msg);
	document.body.append(t);
	setTimeout(() => t.remove(), err ? 6000 : 2500);
}
async function reload() {
	S = await api('GET', 'state');
	render();
	// Files changed on disk: show the saved page again (the live preview fills itself instead).
	const f = pane?.querySelector('iframe');
	if (f && !pane.hidden && !f.src.endsWith('/admin-preview/')) f.src = f.src;
}
// Every change goes through here, so the "unsaved" marker and the confirm on leave stay right.
const touch = () => { dirty = true; $('#save')?.classList.add('dirty'); };
function leave() {
	return !dirty || confirm('Hay cambios sin guardar. ¿Descartarlos?');
}
function go(v, s = null) {
	if (!leave()) return;
	view = v; sel = s; draft = null; dirty = false;
	render();
}
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
addEventListener('keydown', (e) => {
	if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('#save')?.click(); }
});

// Inputs bound to a path inside the draft.
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; touch(); };
const text = (obj, path, attrs = {}) => h('input', { value: get(obj, path) ?? '', oninput: (e) => set(obj, path, e.target.value), ...attrs });
const area = (obj, path, attrs = {}) => h('textarea', { value: get(obj, path) ?? '', oninput: (e) => set(obj, path, e.target.value), ...attrs });
// "Sin traducir": empty in the language being edited while the other one has text.
const untranslated = (obj, l = lang) => !String(obj?.[l] ?? '').trim() && !!String(obj?.[l === 'es' ? 'en' : 'es'] ?? '').trim();
const missing = h.bind(null, 'span.tag.off', {}, 'sin traducir');
const field = (label, input, hint) => h('label', {}, label, input, hint && h('span.hint', {}, hint));
const seg = (name, options, value, onpick) =>
	h('div.seg', { role: 'radiogroup' }, options.map(([v, l]) => h('label', {}, h('input', { type: 'radio', name, checked: (value ?? '') === v, onchange: () => onpick(v) }), l)));
const select = (options, value, onpick) => h('select', { onchange: (e) => onpick(e.target.value) }, options.map(([v, l]) => h('option', { value: v, selected: v === (value ?? '') }, l)));

// Preview width: dragged from its left edge and remembered; null goes back to half and half.
let full = false;
function setPaneWidth(px) {
	const app = $('#app');
	// Capped by the window, so a width saved on a big screen never squeezes the editor on a smaller one.
	if (px) app.style.setProperty('--pw', `min(${px}px, calc(100vw - var(--nav-w) - var(--list-w) - 320px))`); else app.style.removeProperty('--pw');
	try { px ? localStorage.setItem('pw', px) : localStorage.removeItem('pw'); } catch {}
}
function dragPane(e) {
	e.preventDefault();
	const app = $('#app');
	app.classList.add('dragging');
	// Leave the editor at least 320px; the preview at least 320px.
	const side = $('nav').offsetWidth + ($('.list')?.offsetWidth ?? 0);
	const move = (ev) => setPaneWidth(Math.round(Math.min(innerWidth - side - 320, Math.max(320, innerWidth - ev.clientX))));
	const up = () => { app.classList.remove('dragging'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
	addEventListener('pointermove', move);
	addEventListener('pointerup', up);
}
addEventListener('keydown', (e) => { if (e.key === 'Escape' && full) { full = false; render(); } });
// Side columns: the menu narrows to icons, the list hides. Remembered per browser.
const remembered = (k) => { try { return localStorage.getItem(k) === '1'; } catch { return false; } };
let navMin = remembered('navMin'), listMin = remembered('listMin');
function side(k, v) {
	if (k === 'navMin') navMin = v; else listMin = v;
	try { localStorage.setItem(k, v ? '1' : '0'); } catch {}
	render();
}
// The preview pane is built once and only pointed elsewhere, so clicking around doesn't reload the same page.
let pane;
function render() {
	const app = $('#app');
	const views = [['games', 'Juegos y proyectos', '▦'], ['blog', 'Blog', '✎'], ['pages', 'Páginas', '▤'], ['media', 'Medios', '▣'], ['site', 'Sitio', '⚙'], ['history', 'Historial', '↺'], ['publish', 'Publicar', '⇪']];
	const [list, editor, url] = ({ games: gamesView, blog: () => docsView('blog'), pages: pagesView, media: mediaView, site: siteView, history: historyView, publish: publishView })[view]();
	// Only screens with a page of the site to show get the pane (and its button).
	const show = preview && !!url;

// Pictures: big photos are scaled to 1600px wide WebP before upload; GIFs and SVGs go as they are.
async function prepare(file) {
	if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return file;
	const img = await createImageBitmap(file);
	if (img.width <= 1600 && file.size < 400_000) return file;
	const scale = Math.min(1, 1600 / img.width);
	const canvas = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * scale), height: Math.round(img.height * scale) });
	canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
	const blob = await new Promise((r) => canvas.toBlob(r, 'image/webp', 0.85));
	return new File([blob], file.name.replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' });
}
async function upload(file) {
	const f = await prepare(file);
	const bytes = new Uint8Array(await f.arrayBuffer());
	let bin = '';
	for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
	return (await api('POST', 'media', { name: f.name, data: btoa(bin) })).url;
}

// Markdown editor: a toolbar, Ctrl+B / Ctrl+I / Ctrl+K, and pictures pasted or dropped straight in.
function mdEditor(d) {
	const ta = h('textarea.body', { value: d.body ?? '', placeholder: 'Escribí en Markdown. Pegá o arrastrá imágenes acá.', 'aria-label': 'Texto' });
	const changed = () => { d.body = ta.value; touch(); sendPreview(); };
	ta.addEventListener('input', changed);
	const put = (text, selStart = text.length, selEnd = selStart) => {
		const at = ta.selectionStart;
		ta.focus();
		ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
		ta.setSelectionRange(at + selStart, at + selEnd);
		changed();
	};
	// **x** around the selection, or around a placeholder that stays selected for typing over.
	const wrap = (a, b, ph) => {
		const s = ta.value.slice(ta.selectionStart, ta.selectionEnd) || ph;
		put(a + s + b, a.length, a.length + s.length);
	};
	// "## " or "- " at the start of each selected line.
	const prefix = (p) => {
		const start = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
		ta.setSelectionRange(start, ta.selectionEnd);
		const lines = ta.value.slice(start, ta.selectionEnd).split('\n');
		put(lines.map((l, i) => (typeof p === 'function' ? p(i) : p) + l.replace(/^(#{1,6} |[-*] |\d+\. |> )/, '')).join('\n'));
	};
	const link = () => {
		const s = ta.value.slice(ta.selectionStart, ta.selectionEnd) || 'texto';
		put(`[${s}](https://)`, s.length + 3, s.length + 11);
	};
	const image = async () => { const url = await pickMedia(); if (url) put(`![](${url})`, 2, 2); };
	const insertFiles = async (files) => {
		for (const f of files) if (f.type.startsWith('image/')) {
			try { put(`![${f.name.replace(/\.\w+$/, '')}](${await upload(f)})\n`); } catch (e) { toast(e.message, true); }
		}
		S.media = (await api('GET', 'state')).media;
	};
	ta.addEventListener('keydown', (e) => {
		if (!(e.ctrlKey || e.metaKey)) return;
		const k = e.key.toLowerCase();
		if (k === 'b') wrap('**', '**', 'negrita');
		else if (k === 'i') wrap('_', '_', 'cursiva');
		else if (k === 'k') link();
		else return;
		e.preventDefault();
	});
	ta.addEventListener('paste', (e) => { const fs = [...e.clipboardData.files]; if (fs.length) { e.preventDefault(); insertFiles(fs); } });
	ta.addEventListener('dragover', (e) => e.preventDefault());
	ta.addEventListener('drop', (e) => { const fs = [...e.dataTransfer.files]; if (fs.length) { e.preventDefault(); ta.setSelectionRange(ta.selectionEnd, ta.selectionEnd); insertFiles(fs); } });
	const b = (label, title, fn) => h('button', { type: 'button', title, 'aria-label': title, onclick: fn }, label);
	const tools = h('div.toolbar', { role: 'toolbar', 'aria-label': 'Formato' },
		b(h('b', {}, 'B'), 'Negrita (Ctrl+B)', () => wrap('**', '**', 'negrita')),
		b(h('i', {}, 'I'), 'Cursiva (Ctrl+I)', () => wrap('_', '_', 'cursiva')),
		b('H2', 'Título de sección', () => prefix('## ')),
		b('H3', 'Subtítulo', () => prefix('### ')),
		b('🔗', 'Link (Ctrl+K)', link),
		b('•', 'Lista', () => prefix('- ')),
		b('1.', 'Lista numerada', () => prefix((i) => `${i + 1}. `)),
		b('❝', 'Cita', () => prefix('> ')),
		b('</>', 'Código', () => (ta.value.slice(ta.selectionStart, ta.selectionEnd).includes('\n') ? wrap('\n```\n', '\n```\n', 'código') : wrap('`', '`', 'código'))),
		b('🖼', 'Imagen', image),
		select([['', 'Insertar…'], ...S.shortcodes.map((s) => [s.name, s.label])], '', (v) => {
			const sc = S.shortcodes.find((s) => s.name === v);
			if (!sc) return;
			// A shortcode is its own paragraph: blank lines around it.
			const before = ta.value.slice(0, ta.selectionStart);
			const pad = !before || before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
			const i = pad.length + sc.insert.indexOf('…');
			put(`${pad}${sc.insert}\n\n`, i, i + 1);
			tools.querySelector('select').value = '';
		}),
		h('a', { href: 'https://www.markdownguide.org/basic-syntax/', target: '_blank', class: 'hint', style: 'margin-left:auto' }, 'Ayuda de Markdown ↗'));
	return h('div.md', {}, tools, ta);
}

		h('div.empty', {}, 'También podés arrastrarlas a esta pantalla, o pegarlas y arrastrarlas en el texto de un post. Las fotos grandes se achican a 1600px de ancho en WebP.'));
	const items = [...S.media].sort((a, b) => a.name.localeCompare(b.name));
	const editor = h('div.editor', { ondragover: (e) => e.preventDefault(), ondrop: (e) => { e.preventDefault(); add([...e.dataTransfer.files].filter((f) => f.type.startsWith('image/'))); } },
		h('h1', {}, 'Medios'),
		h('p.hint', {}, `${items.length} imágenes en public/media/ · ${kb(items.reduce((n, m) => n + m.size, 0))}`),
		h('div.grid.big', {}, items.map((m) => h('div.card', {},
			h('img', { src: '/public' + m.url, alt: '', loading: 'lazy' }),
			h('div.t', {}, m.name), h('div.hint', {}, kb(m.size)),
			h('div.hint', {}, m.usedIn.length ? ['Usada en: ', m.usedIn.map((f) => { const open = openFile(f); return open ? h('button.link', { onclick: open, style: 'margin-right:8px' }, f.replace(/^content\//, '')) : f.replace(/^content\//, '') + ' '; })] : 'Sin usar'),
			h('div.bar', {},
				h('button', { onclick: async () => { await navigator.clipboard.writeText(`![](${m.url})`); toast('Copiado'); } }, 'Copiar Markdown'),
				// Replace keeps the name, so every page and post using it shows the new picture.
				h('button', { onclick: () => {
					const input = h('input', { type: 'file', accept: m.name.match(/\.\w+$/)[0], onchange: async (e) => {
						const f = e.target.files[0];
						if (!f) return;
						try {
							const bytes = new Uint8Array(await f.arrayBuffer());
							let bin = '';
							for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
							await api('POST', 'media', { name: f.name, data: btoa(bin), replace: m.name });
							await reload();
							toast(m.usedIn.length ? `Reemplazada en ${m.usedIn.length} lugar(es)` : 'Reemplazada');
						} catch (err) { toast(err.message, true); }
					} });
					input.click();
				} }, 'Reemplazar…'),
				h('button', { onclick: async () => {
					const to = prompt(`Nuevo nombre para «${m.name}». ${m.usedIn.length ? `Se actualiza en los ${m.usedIn.length} lugar(es) donde se usa.` : ''}`, m.name);
					if (!to || to === m.name) return;
					try { await api('POST', `rename-media/${m.name}`, { to }); await reload(); toast('Renombrada'); } catch (err) { toast(err.message, true); }
				} }, 'Renombrar…'),
				h('button.danger', { onclick: async () => {
					if (!confirm(m.usedIn.length ? `«${m.name}» se usa en ${m.usedIn.length} lugar(es); ahí va a quedar una imagen rota. ¿Borrarla igual?` : `¿Borrar «${m.name}»?`)) return;
					await api('DELETE', `media/${m.name}`);
					await reload();
				} }, 'Borrar'))))),
		!items.length && h('p', {}, 'Todavía no hay imágenes.'));
	return [list, editor, null];
}

// ---------- Interface texts (content/texts.json), edited under Sitio.
// Visual editing, Storyblok style: click a text in the preview and its field opens here; type and the page changes live.
// Texts the page doesn't show (alt texts, other pages' texts) stay in the list below.
let onPage = null, onlyPage = true; // keys the preview found on its page; null until it answers
const textKeys = (o, path = []) => Object.entries(o).flatMap(([k, v]) => {
	const p = [...path, k];
	if (p.join('.') === 'dateLocale') return []; // a setting, not a text: breaking it breaks every date
	return v && typeof v === 'object' ? textKeys(v, p) : [p.join('.')];
});
const frame = () => (pane && !pane.hidden ? pane.querySelector('iframe').contentWindow : null);
// The preview asks for texts on every page load, also when you follow a link inside it.
function sendTexts() {
	const f = frame();
	if (!f) return;
	onPage = null;
	// Site texts, a page's blocks, or (anywhere else) nothing, which takes the outlines off.
	if (view === 'pages' && draft?.blocks) return f.postMessage({ type: 'edit', texts: blockTexts(), blocks: true }, S.site);
	const editing = draft && view === 'site' && sel === 'texts';
	f.postMessage({ type: 'edit', texts: editing ? Object.fromEntries(textKeys(draft[lang]).map((k) => [k, get(draft[lang], k)])) : {} }, S.site);
}
addEventListener('message', (e) => {
	if (e.origin !== S?.site) return;
	if (e.data === 'site-ready') sendTexts();
	else if (e.data?.type === 'marked') {
		onPage = new Set(e.data.keys);
		filterRows();
		// After a reload, keep the block being edited in view.
		if (view === 'pages' && openBlock) frame()?.postMessage({ type: 'block', id: openBlock }, S.site);
	}
	else if (e.data?.type === 'select') view === 'pages' ? openFromPreview(e.data.keys[0].split('.')[0], e.data.keys[0]) : pickRow(e.data.keys[0]);
	else if (e.data?.type === 'block') openFromPreview(e.data.id);
});
function filterRows() {
	const q = $('#find')?.value.toLowerCase() ?? '';
	for (const r of document.querySelectorAll('.text-row')) {
		const k = r.dataset.key, v = r.querySelector('input,textarea').value.toLowerCase();
		r.hidden = (onlyPage && onPage && !onPage.has(k)) || (!!q && !k.toLowerCase().includes(q) && !v.includes(q));
	}
	const n = $('#on-page');
	if (n) n.textContent = onPage ? `${onPage.size} en esta página` : 'buscando en la página…';
}
function pickRow(key) {
	if (full) { full = false; render(); } // a text clicked in the full-width preview: back to its field
	const r = document.querySelector(`.text-row[data-key="${CSS.escape(key)}"]`);
	if (!r) return;
	document.querySelectorAll('.text-row.on').forEach((x) => x.classList.remove('on'));
	r.hidden = false;
	r.classList.add('on');
	r.scrollIntoView({ block: 'center', behavior: 'smooth' });
	r.querySelector('input,textarea').focus({ preventScroll: true });
}
// The interface texts (content/texts.json): menu, footer, game pages, blog, 404. Under Sitio.
function textsView() {
	draft ??= clone(S.texts);
	const other = lang === 'es' ? 'en' : 'es';
	const save = async () => {
		await api('PUT', 'texts', draft);
		dirty = false; draft = null;
		await reload();
		toast('Guardado');
	};
	const row = (key) => {
		const v = String(get(draft[lang], key) ?? '');
		const attrs = { value: v, 'aria-label': key, placeholder: String(get(draft[other], key) ?? ''),
			oninput: (e) => { set(draft[lang], key, e.target.value); frame()?.postMessage({ type: 'update', key, value: e.target.value }, S.site); },
			onfocus: () => frame()?.postMessage({ type: 'select', key }, S.site) };
		return h('div.text-row', { 'data-key': key },
			h('div.hint', {}, key.split('.').join(' › '), untranslated({ [lang]: v, [other]: get(draft[other], key) }) && missing()),
			v.length > 60 || /<\w/.test(v) ? h('textarea', { ...attrs, rows: Math.min(6, Math.ceil(v.length / 70) + 1) }) : h('input', attrs));
	};
	const editor = h('div.editor', {},
		h('div.bar', {}, h('h1.grow', {}, 'Textos de la interfaz'), h('span.tag', {}, LANGS[lang]), h('button.primary', { id: 'save', onclick: () => save().catch((e) => toast(e.message, true)) }, 'Guardar')),
		h('p.hint', {}, preview
			? 'Hacé clic en un texto de la vista previa para editarlo acá; mientras escribís, la página cambia. Podés navegar el sitio dentro de la vista previa.'
			: 'Abrí la vista previa para elegir los textos haciendo clic en la página.',
			' Son los textos fijos de las partes del sitio que no son páginas de bloques: el menú, el pie, la ficha de cada juego, el blog y la página de error. Lo que no se ve en la página abierta aparece al destildar «Solo los de esta página», o buscándolo.'),
		h('div.bar', {},
			h('input.grow', { id: 'find', type: 'search', placeholder: 'Buscar un texto…', 'aria-label': 'Buscar un texto', oninput: filterRows, style: 'flex:1 1 200px;width:auto' }),
			preview && h('label.check', {}, h('input', { type: 'checkbox', checked: onlyPage, onchange: (e) => { onlyPage = e.target.checked; filterRows(); } }), 'Solo los de esta página', h('span.hint', { id: 'on-page' }))),
		textKeys(draft[lang]).map(row));
	queueMicrotask(filterRows);
	return [siteList(), editor, `/${lang}/`];
}

// ---------- Site: contact links and wikis, and the interface texts
const siteList = () => h('div.list', {},
	h('button.item', { 'aria-current': String(sel !== 'texts'), onclick: () => go('site') }, h('span', {}, h('div.t', {}, 'Links y wikis'), h('div.s', {}, 'Contacto, en el pie y en /links/'))),
	h('button.item', { 'aria-current': String(sel === 'texts'), onclick: () => go('site', 'texts') }, h('span', {}, h('div.t', {}, 'Textos de la interfaz'), h('div.s', {}, 'Menú, pie, fichas de juegos, blog'))));
function siteView() {
	if (sel === 'texts') return textsView();
	draft ??= { profile: clone(S.profile), wikis: clone(S.sources.wikis ?? []) };
	const links = draft.profile.links;
	const box = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
	const move = (i, j) => { [links[i], links[j]] = [links[j], links[i]]; touch(); draw(); };
	const draw = () => box.replaceChildren(...links.map((l, i) => h('div.row.link', {},
		text(l, 'label', { placeholder: 'Texto', 'aria-label': 'Texto' }), text(l, 'url', { placeholder: 'https://… o mailto:…', 'aria-label': 'URL' }),
		h('button', { disabled: i === 0, onclick: () => move(i, i - 1), 'aria-label': 'Subir' }, '↑'), h('button', { disabled: i === links.length - 1, onclick: () => move(i, i + 1), 'aria-label': 'Bajar' }, '↓'),
		h('button.link', { onclick: () => { links.splice(i, 1); touch(); draw(); } }, 'Quitar'))),
		h('div', {}, h('button', { onclick: () => { links.push({ label: '', url: '' }); touch(); draw(); } }, '+ Link')));
	draw();
	const save = async () => {
		if (links.some((l) => !l.label.trim() || !l.url.trim())) throw new Error('Cada link necesita texto y URL');
		await api('PUT', 'profile', draft.profile);
		await api('PUT', 'sources', { ...S.sources, wikis: draft.wikis.map((w) => w.trim()).filter(Boolean) });
		dirty = false; draft = null;
		await reload();
		toast('Guardado');
	};
	const editor = h('div.editor', {},
		h('div.bar', {}, h('h1.grow', {}, 'Sitio'), h('button.primary', { id: 'save', onclick: () => save().catch((e) => toast(e.message, true)) }, 'Guardar')),
		h('fieldset', {}, h('legend', {}, 'Links de contacto'), h('span.hint', {}, 'En el pie de cada página y en /links/, en este orden. El de itch.io también va en el primer pantallazo.'), box),
		h('fieldset', {}, h('legend', {}, 'Wikis'), h('span.hint', {}, 'Una por línea: usuario/repo usa su carpeta docs/; para otra carpeta, su link github.com/usuario/repo/tree/main/carpeta. Se publica en /wiki/<repo>/ al traer datos de las tiendas.'),
			h('textarea', { rows: 4, value: draft.wikis.join('\n'), oninput: (e) => { draft.wikis = e.target.value.split('\n'); touch(); } }))
	);
	return [siteList(), editor, `/${lang}/links/`];
}

// ---------- History: every published change to the content, and what isn't published yet, each file undoable.
let H = null, showBots = false;
const ST = { M: 'Cambiado', A: 'Nuevo', D: 'Borrado', R: 'Renombrado', '?': 'Nuevo' };
// "content/games/fracas.json" -> "Fracas (tu ficha)": what a file is, in the panel's words.
function fileName(p) {
	const game = (slug) => S.games.find((g) => g.slug === slug)?.store.title ?? slug;
	const doc = (kind, slug) => (S[kind].find((d) => d.slug === slug)?.es ?? S[kind].find((d) => d.slug === slug)?.en)?.data.title;
	let m;
	if ((m = p.match(/^content\/games\/(.+)\.json$/))) return `${game(m[1])} · tu ficha`;
	if ((m = p.match(/^content\/store\/(.+)\.json$/))) return `${game(m[1])} · datos de la tienda`;
	if ((m = p.match(/^public\/games\/([^/]+)\/(.+)$/))) return `${game(m[1])} · imagen ${m[2]}`;
	if ((m = p.match(/^content\/(blog|pages)\/(es|en)\/(.+)\.md$/))) return `${m[1] === 'blog' ? 'Post' : 'Página'} «${(m[1] === 'blog' && doc(m[1], m[3])) || m[3]}» (${m[2]})`;
	if ((m = p.match(/^content\/pages\/(.+)\.json$/))) return m[1] === 'home' ? 'Página de inicio' : `Página «${(S.pages[m[1]] && pageTitle(S.pages[m[1]])) || m[1]}»`;
	if ((m = p.match(/^public\/media\/(.+)$/))) return `Medios · ${m[1]}`;
	return { 'content/texts.json': 'Textos del sitio', 'content/sources.json': 'Lista de juegos y proyectos', 'content/profile.json': 'Links de contacto' }[p] ?? p;
}
function diffView(text) {
	if (/^Binary files/m.test(text)) return h('p.hint', {}, 'Archivo binario (una imagen): no hay texto que comparar.');
	const lines = text.split('\n').filter((l) => !/^(diff --git|index |--- |\+\+\+ |new file mode|deleted file mode)/.test(l));
	return h('pre.log.diff', {}, lines.map((l) => h('span', { className: l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : l.startsWith('@@') ? 'hunk' : '' }, l + '\n')));
}
async function loadHistory() {
	try { H = await api('GET', 'history'); } catch (e) { H = []; toast(e.message, true); }
	if (view === 'history') render();
}
function historyView() {
	if (!H) { loadHistory(); return [h('div.list'), h('div.empty', {}, 'Leyendo el historial…'), null]; }
	const commits = H.filter((c) => showBots || !c.bot);
	// Unpublished changes: git status lines like " M path", "?? path", "R  old -> new".
	const local = S.changes.map((l) => ({ status: l.slice(0, 2).trim()[0] ?? 'M', path: l.slice(3).split(' -> ').at(-1) }));
	const when = (d) => new Date(d).toLocaleString('es-AR', { dateStyle: 'medium', timeStyle: 'short' });
	const list = h('div.list', {},
		h('div.list-head', {}, h('label.check', {}, h('input', { type: 'checkbox', checked: showBots, onchange: (e) => { showBots = e.target.checked; render(); } }), h('span.hint', {}, 'Mostrar las sincronizaciones automáticas de las tiendas'))),
		h('button.item', { 'aria-current': String(sel === 'local'), onclick: () => go('history', 'local') }, h('span', {}, h('div.t', {}, 'Sin publicar'), h('div.s', {}, local.length ? `${local.length} archivo(s)` : 'nada'))),
		commits.map((c) => h('button.item', { 'aria-current': String(sel === c.sha), onclick: () => go('history', c.sha) },
			h('span', { style: 'min-width:0' }, h('div.t', {}, c.message), h('div.s', {}, when(c.date), c.bot && h('span.tag', {}, 'automático'), ` · ${c.files.length} archivo(s)`)))));
	const c = sel === 'local' ? { sha: null, message: 'Cambios sin publicar', files: local } : H.find((x) => x.sha === sel);
	if (!c) return [list, h('div.empty', {}, 'Cada vez que publicás (o la sincronización diaria trae datos nuevos) queda un cambio acá. Podés ver qué cambió en cada archivo y deshacerlo.'), null];
	const undo = async (paths, what) => {
		if (!confirm(c.sha ? `¿Deshacer ${what}? Los archivos vuelven a como estaban antes de este cambio (lo que cambió después, se pisa). Después hay que publicar.` : `¿Descartar ${what}? Vuelve a como está publicado.`)) return;
		try {
			await api('POST', 'restore', { sha: c.sha, path: paths });
			await reload();
			loadHistory();
			toast(c.sha ? 'Deshecho. Publicá para que llegue al sitio.' : 'Descartado');
		} catch (e) { toast(e.message, true); }
	};
	const row = (f) => {
		const box = h('div');
		let open = false;
		const toggle = async () => {
			open = !open;
			if (!open) return box.replaceChildren();
			const { text } = await api('POST', 'diff', { sha: c.sha, path: f.path });
			box.replaceChildren(diffView(text));
		};
		return h('div.change', {},
			h('div.bar', {}, h('span.tag', {}, ST[f.status] ?? f.status), h('span.grow', { title: f.path }, fileName(f.path), h('div.hint', {}, f.path)),
				h('button', { onclick: toggle }, 'Ver cambios'), h('button.danger', { onclick: () => undo([f.path], `el cambio en «${fileName(f.path)}»`) }, c.sha ? 'Deshacer' : 'Descartar')),
			box);
	};
	const editor = h('div.editor', {},
		h('h1.msg', {}, c.message),
		c.sha && h('p.hint', {}, `${when(c.date)} · ${c.author} · ${c.sha.slice(0, 7)}`),
		c.files.length ? [
			c.files.map(row),
			c.files.length > 1 && h('div', {}, h('button.danger', { onclick: () => undo(c.files.map((f) => f.path), c.sha ? 'todo este cambio' : 'todos los cambios sin publicar') }, c.sha ? 'Deshacer todo este cambio' : 'Descartar todo'))
		] : h('p.hint', {}, 'Todo publicado.'));
	return [list, editor, null];
}

// ---------- Publish
// What's worth a look before publishing; none of it blocks.
function warnings() {
	const w = [];
	for (const [slug, p] of Object.entries(S.pages)) {
		const name = slug === 'home' ? 'Inicio' : `Página «${pageTitle(p) || slug}»`;
		const open = () => go('pages', slug);
		if (p.draft) w.push([`${name}: es borrador, no se publica`, open]);
		// Translated texts filled in one language only, anywhere in its blocks.
		let half = 0;
		const walk = (o) => { if (Array.isArray(o)) return o.forEach(walk); if (!o || typeof o !== 'object') return; if ('es' in o && 'en' in o && typeof o.es === 'string') { if (!!o.es.trim() !== !!o.en.trim()) half++; return; } Object.values(o).forEach(walk); };
		walk(p.blocks);
		if (half) w.push([`${name}: ${half} texto(s) en un solo idioma`, open]);
	}
	for (const kind of ['blog']) for (const d of S[kind]) {
		const m = (d.es ?? d.en).data;
		const name = `${kind === 'blog' ? 'Post' : 'Página'} «${m.title}»`;
		const open = () => go(kind, d.slug);
		if (!d.es || !d.en) w.push([`${name}: solo en ${d.es ? 'español' : 'inglés'}`, open]);
		if (m.draft) w.push([`${name}: es borrador, no se publica`, open]);
		else if (scheduled(m)) w.push([`${name}: programado para el ${fmtDay(m.date)}`, open]);
	}
	for (const g of S.games) {
		const o = g.own;
		for (const [k, label] of [['summary', 'texto propio'], ['role', 'rol']]) {
			if (o.show === 'hidden') continue;
			const es = o[k]?.es?.trim(), en = o[k]?.en?.trim();
			if (!!es !== !!en) w.push([`«${g.store.title}»: ${label} solo en ${es ? 'español' : 'inglés'}`, () => go('games', g.slug)]);
		}
	}
	return w;
}
function publishView() {
	const runIt = (label, path, body) => async (e) => {
		if (busy) return;
		busy = label;
		e.target.disabled = true;
		e.target.textContent = `${label}…`;
		try {
			const r = await api('POST', path, body);
			lastLog = r.log;
			toast(r.ok ? `${label}: listo` : `${label}: falló, mirá el registro`, !r.ok);
		} catch (err) { toast(err.message, true); }
		busy = '';
		H = null;
		await reload();
	};
	const msg = h('input', { placeholder: 'content: update from admin', 'aria-label': 'Mensaje del commit' });
	const warn = warnings();
	const editor = h('div.editor', {},
		h('h1', {}, 'Publicar'),
		h('fieldset', {}, h('legend', {}, 'Datos de las tiendas'),
			h('span.hint', {}, 'Trae títulos, imágenes y textos de Steam, itch.io, GitHub y el Asset Library, y las wikis; saca lo que quitaste de la lista. También corre solo en cada deploy y todos los días.'),
			h('div', {}, h('button', { onclick: runIt('Traer datos de las tiendas', 'sync') }, 'Traer datos de las tiendas'))),
		h('fieldset', {}, h('legend', {}, `Para revisar (${warn.length})`),
			warn.length ? h('ul', { style: 'margin:0;padding-left:1.2em' }, warn.map(([t, open]) => h('li', {}, h('button.link', { onclick: open }, t)))) : h('span.hint', {}, 'Nada: todo traducido y sin borradores.')),
		h('fieldset', {}, h('legend', {}, `Cambios sin publicar (${S.changes.length})`),
			S.changes.length ? h('pre.log', {}, S.changes.join('\n')) : h('span.hint', {}, 'Todo publicado.'),
			field('Mensaje', msg),
			h('div.bar', {},
				h('button.primary', { disabled: !S.changes.length, onclick: (e) => runIt('Publicar', 'publish', { message: msg.value })(e) }, 'Publicar'),
				h('button', { onclick: runIt('Comprobar', 'check') }, 'Comprobar sin publicar')),
			h('span.hint', {}, 'Primero compila el sitio entero; si algo falla (un dato roto, un shortcode mal escrito) no publica nada y muestra el error. Si anda, hace commit de content/ y public/ y lo sube a main; el sitio se actualiza en unos minutos.')),
		lastLog && h('fieldset', {}, h('legend', {}, 'Registro'), h('pre.log', {}, lastLog))
	);
	return [h('div.list', {}, h('div.empty', {}, 'Guardar escribe los archivos en tu equipo. Publicar los sube.')), editor, null];
}

try { const pw = Number(localStorage.getItem('pw')); if (pw) $('#app').style.setProperty('--pw', `min(${pw}px, calc(100vw - var(--nav-w) - var(--list-w) - 320px))`); } catch {}
reload().catch((e) => { document.body.textContent = `No pude leer el contenido: ${e.message}`; });
</script>
