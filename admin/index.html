<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dann · admin</title>
<style>
	:root {
		--bg: #0e0f12; --surface: #16181d; --surface-2: #1b1d23; --surface-3: #2a2d35;
		--ink: #f2f2ee; --muted: #b4b7be; --accent: #d7f25c; --accent-ink: #0e0f12; --danger: #f27a6b; --warn: #f2c25c;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
	a { color: var(--accent); }
	button, input, select, textarea { font: inherit; color: inherit; }
	input, select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--surface-3); border-radius: 6px; padding: 8px 10px; }
	input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	textarea { resize: vertical; min-height: 5em; }
	textarea.body { min-height: 24em; font: 14px/1.6 'JetBrains Mono', ui-monospace, monospace; }
	button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 14px; background: var(--surface-3); }
	button:hover { filter: brightness(1.15); }
	button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
	button.danger { background: none; color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
	button.link { background: none; padding: 0; color: var(--accent); text-decoration: underline; }
	button:disabled { opacity: 0.5; cursor: default; }
	label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
	.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
	.app { display: grid; grid-template-columns: 200px 300px minmax(0, 1fr); height: 100vh; }
	.app.preview { grid-template-columns: 200px 300px minmax(0, 1fr) minmax(0, 1fr); }
	nav { background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
	nav .brand { font: 700 22px 'Space Grotesk', system-ui; padding: 0 8px 16px; }
	nav button { text-align: left; background: none; display: flex; justify-content: space-between; }
	nav button[aria-current='true'] { background: var(--surface-3); }
	nav .grow { flex: 1; }
	.badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 700; }
	.list { border-right: 1px solid var(--surface-3); overflow-y: auto; display: flex; flex-direction: column; }
	.list-head { padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--surface-3); position: sticky; top: 0; background: var(--bg); z-index: 1; }
	.item { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: none; border-radius: 0; text-align: left; width: 100%; }
	.item[aria-current='true'] { background: var(--surface-2); box-shadow: inset 3px 0 var(--accent); }
	.item img, .item .ph { width: 56px; height: 36px; object-fit: cover; border-radius: 4px; background: var(--surface-3); flex: none; }
	.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.item .s { font-size: 12px; color: var(--muted); }
	.group { padding: 14px 16px 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
	.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); margin-left: 4px; }
	.tag.on { background: var(--accent); color: var(--accent-ink); }
	.tag.off { color: var(--warn); }
	main { overflow-y: auto; }
	.editor { max-width: 820px; padding: 24px 32px 120px; display: flex; flex-direction: column; gap: 22px; }
	.editor h1 { font: 700 28px/1.1 'Space Grotesk', system-ui; margin: 0; }
	.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
	.bar .grow { flex: 1; }
	.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
	fieldset { border: 1px solid var(--surface-3); border-radius: 8px; padding: 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; }
	legend { padding: 0 6px; font-weight: 600; }
	.seg { display: flex; flex-wrap: wrap; gap: 6px; }
	.seg label { flex-direction: row; align-items: center; gap: 6px; padding: 6px 12px; background: var(--surface-2); border-radius: 999px; font-weight: 400; cursor: pointer; }
	.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
	.seg input { width: auto; accent-color: var(--accent-ink); }
	.check { flex-direction: row; align-items: center; gap: 8px; }
	.check input { width: auto; }
	.row { display: grid; grid-template-columns: 150px 150px 1fr 1fr auto; gap: 8px; align-items: center; }
	.row.link { grid-template-columns: 180px 1fr auto auto auto; }
	.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--surface-3); }
	.tabs button { background: none; border-radius: 6px 6px 0 0; }
	.tabs button[aria-selected='true'] { background: var(--surface-3); }
	.empty { color: var(--muted); padding: 40px 32px; }
	pre.log { background: var(--surface); padding: 12px; border-radius: 6px; max-height: 420px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
	.preview-pane { border-left: 1px solid var(--surface-3); display: flex; flex-direction: column; }
	.preview-pane .bar { padding: 8px 12px; font-size: 13px; color: var(--muted); }
	.preview-pane iframe { flex: 1; border: 0; background: #fff; width: 100%; }
	.toast { position: fixed; bottom: 20px; left: 50%; translate: -50%; background: var(--surface-3); padding: 10px 18px; border-radius: 8px; box-shadow: 0 6px 24px #0008; z-index: 9; }
	.toast.err { background: var(--danger); color: var(--accent-ink); }
	.dirty::after { content: ' ●'; color: var(--warn); }
	@media (max-width: 900px) {
		.app, .app.preview { grid-template-columns: 1fr; height: auto; }
		nav { flex-direction: row; flex-wrap: wrap; } nav .grow { display: none; }
		.list { border-right: 0; max-height: 40vh; }
		.preview-pane { height: 70vh; }
		.two, .row, .row.link { grid-template-columns: 1fr; }
	}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const TOKEN = '__TOKEN__';
const LANGS = { es: 'Español', en: 'English' };
const AI = [['', 'Sin definir'], ['hand', 'Hecho a mano'], ['assisted', 'Asistido por IA'], ['vibe', 'Vibe-coded']];
const SHOW = [['listed', 'En su lista'], ['featured', 'Destacado'], ['hidden', 'Oculto']];
const AREAS = [['design', 'Diseño'], ['code', 'Código'], ['art', 'Arte'], ['audio', 'Audio'], ['writing', 'Escritura'], ['tools', 'Herramientas'], ['debugging', 'Depuración']];
const WHO = [['me', 'Yo'], ['ai', 'IA + revisión'], ['team', 'Equipo'], ['third', 'Terceros']];
const STORES = { steam: 'Steam', itch: 'itch.io', github: 'GitHub', assetlib: 'Asset Library' };

// The same reading of links as scripts/sync-games.mjs, to tie each source entry to its synced game.
const steamId = (v) => Number(String(v).match(/(?:app\/)?(\d+)/)?.[1]);
const itchUrl = (v) => String(v).trim().replace(/\/$/, '');
const githubRepo = (v) => String(v).trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
const assetId = (v) => Number(String(v).match(/(?:asset\/)?(\d+)/)?.[1]);
const matches = {
	steam: (e, g) => steamId(e) === g.id,
	itch: (e, g) => itchUrl(e.url ?? e) === g.url,
	github: (e, g) => `https://github.com/${githubRepo(e)}`.toLowerCase() === g.url.toLowerCase(),
	assetlib: (e, g) => assetId(e) === g.id
};
// A pasted link -> which store list it goes in, or null.
function detect(link) {
	const v = link.trim();
	if (/^https:\/\/store\.steampowered\.com\/app\/\d+/.test(v)) return ['steam', v];
	if (/^https:\/\/[\w-]+\.itch\.io\/[\w-]+\/?$/.test(v)) return ['itch', { url: itchUrl(v), repo: '' }];
	if (/^https:\/\/godotengine\.org\/asset-library\/asset\/\d+/.test(v)) return ['assetlib', v];
	if (/^(https:\/\/github\.com\/)?[\w.-]+\/[\w.-]+\/?$/.test(v)) return ['github', githubRepo(v)];
	return null;
}

let S; // everything the server read from disk
let view = 'games', sel = null, lang = 'es', draft = null, dirty = false, preview = false, busy = '', lastLog = '';
const $ = (q) => document.querySelector(q);
const clone = (v) => JSON.parse(JSON.stringify(v));
const slugify = (s) => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const today = () => new Date().toLocaleDateString('sv'); // local YYYY-MM-DD, not UTC

// h('tag.class', {attrs, on*: handler}, ...children)
function h(sel, attrs = {}, ...kids) {
	const [tag, ...cls] = sel.split('.');
	const el = document.createElement(tag || 'div');
	if (cls.length) el.className = cls.join(' ');
	for (const [k, v] of Object.entries(attrs ?? {})) {
		if (v === false || v == null) continue;
		if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else if (k in el && k !== 'list') el[k] = v;
		else el.setAttribute(k, v === true ? '' : v);
	}
	el.append(...kids.flat(Infinity).filter((k) => k != null && k !== false));
	return el;
}

async function api(method, path, body) {
	const res = await fetch(`/api/${path}`, { method, headers: { 'x-admin-token': TOKEN, 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
	const out = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(out.error || res.statusText);
	return out;
}
function toast(msg, err) {
	const t = h('div.toast' + (err ? '.err' : ''), { role: 'status' }, msg);
	document.body.append(t);
	setTimeout(() => t.remove(), err ? 6000 : 2500);
}
async function reload() {
	S = await api('GET', 'state');
	render();
}
// Every change goes through here, so the "unsaved" marker and the confirm on leave stay right.
const touch = () => { dirty = true; $('#save')?.classList.add('dirty'); };
function leave() {
	return !dirty || confirm('Hay cambios sin guardar. ¿Descartarlos?');
}
function go(v, s = null) {
	if (!leave()) return;
	view = v; sel = s; draft = null; dirty = false;
	render();
}
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
addEventListener('keydown', (e) => {
	if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('#save')?.click(); }
});

// Inputs bound to a path inside the draft.
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => (a[k] ??= {}), o)[last] = v; touch(); };
const text = (obj, path, attrs = {}) => h('input', { value: get(obj, path) ?? '', oninput: (e) => set(obj, path, e.target.value), ...attrs });
const area = (obj, path, attrs = {}) => h('textarea', { value: get(obj, path) ?? '', oninput: (e) => set(obj, path, e.target.value), ...attrs });
const field = (label, input, hint) => h('label', {}, label, input, hint && h('span.hint', {}, hint));
const seg = (name, options, value, onpick) =>
	h('div.seg', { role: 'radiogroup' }, options.map(([v, l]) => h('label', {}, h('input', { type: 'radio', name, checked: (value ?? '') === v, onchange: () => onpick(v) }), l)));
const select = (options, value, onpick) => h('select', { onchange: (e) => onpick(e.target.value) }, options.map(([v, l]) => h('option', { value: v, selected: v === (value ?? '') }, l)));

function render() {
	const app = $('#app');
	app.className = 'app' + (preview ? ' preview' : '');
	const views = [['games', 'Juegos y proyectos'], ['blog', 'Blog'], ['pages', 'Páginas'], ['site', 'Sitio'], ['publish', 'Publicar']];
	const nav = h('nav', {}, h('div.brand', {}, 'dann'), views.map(([v, l]) =>
		h('button', { 'aria-current': String(view === v), onclick: () => go(v) }, l, v === 'publish' && S.changes.length ? h('span.badge', { title: 'Cambios sin publicar' }, S.changes.length) : null)
	), h('div.grow'), h('button', { onclick: () => { preview = !preview; render(); } }, preview ? 'Ocultar vista previa' : 'Vista previa'), h('a', { href: S.site, target: '_blank', style: 'padding:8px 14px' }, 'Abrir el sitio ↗'));
	const [list, editor, url] = ({ games: gamesView, blog: () => docsView('blog'), pages: () => docsView('pages'), site: siteView, publish: publishView })[view]();
	app.replaceChildren(nav, list, h('main', {}, editor), preview ? h('div.preview-pane', {}, h('div.bar', {}, h('span.grow', {}, url || '/'), h('button.link', { onclick: () => { $('iframe').src = $('iframe').src; } }, 'Recargar')), h('iframe', { src: S.site + (url || `/${lang}/`), title: 'Vista previa' })) : '');
	if (dirty) $('#save')?.classList.add('dirty');
}

// ---------- Games
function sourceOf(g) {
	const list = S.sources[g.store.source] ?? [];
	const i = list.findIndex((e) => matches[g.store.source](e, g.store));
	return i < 0 ? null : { list, i, entry: list[i] };
}
function pending() {
	// Listed in sources but with no store data yet: new, private, or failing.
	return Object.entries(STORES).flatMap(([k]) => (S.sources[k] ?? []).filter((e) => !S.games.some((g) => g.store.source === k && matches[k](e, g.store))).map((e) => [k, e]));
}
function gamesView() {
	const games = [...S.games].sort((a, b) => a.store.title.localeCompare(b.store.title));
	const add = h('input', { placeholder: 'Pegá un link de Steam, itch.io, GitHub o Asset Library', 'aria-label': 'Agregar juego o proyecto' });
	const addIt = async () => {
		const d = detect(add.value);
		if (!d) return toast('No reconozco ese link', true);
		const [k, entry] = d;
		const next = clone(S.sources);
		(next[k] ??= []).push(entry);
		await api('PUT', 'sources', next);
		add.value = '';
		await reload();
		toast(`Agregado a ${STORES[k]}. Traé sus datos desde Publicar › Traer datos de las tiendas.`);
	};
	add.addEventListener('keydown', (e) => e.key === 'Enter' && addIt());
	const item = (g) => h('button.item', { 'aria-current': String(sel === g.slug), onclick: () => go('games', g.slug) },
		g.store.cover ? h('img', { src: '/public' + g.store.cover, alt: '' }) : h('span.ph'),
		h('span', { style: 'min-width:0' }, h('div.t', {}, g.store.title), h('div.s', {}, STORES[g.store.source],
			g.own.show === 'featured' && h('span.tag.on', {}, 'destacado'), g.own.show === 'hidden' && h('span.tag.off', {}, 'oculto'), g.own.ai && h('span.tag', {}, AI.find(([v]) => v === g.own.ai)?.[1]))));
	const pend = pending();
	const list = h('div.list', {}, h('div.list-head', {}, add, h('button', { onclick: addIt }, 'Agregar')),
		Object.keys(STORES).map((k) => games.some((g) => g.store.source === k) && [h('div.group', {}, STORES[k]), games.filter((g) => g.store.source === k).map(item)]),
		pend.length > 0 && [h('div.group', {}, 'Sin datos todavía'), pend.map(([k, e]) => h('div.item', {}, h('span.ph'), h('span', { style: 'min-width:0' }, h('div.t', {}, String(e.url ?? e)), h('div.s', {}, `${STORES[k]} · privado o sin sincronizar`))))]
	);
	const g = S.games.find((x) => x.slug === sel);
	if (!g) return [list, h('div.empty', {}, 'Elegí un juego o proyecto. Los datos de la tienda (título, imágenes, fechas) se traen solos; acá editás lo tuyo.')];
	draft ??= { own: { ai: '', show: 'listed', landing: '', role: { es: '', en: '' }, summary: { es: '', en: '' }, authorship: [], ...clone(g.own) }, repo: sourceOf(g)?.entry?.repo ?? '' };
	const o = draft.own;
	const src = sourceOf(g);
	const linked = S.pages.filter((p) => (p.es ?? p.en).data.project === g.slug);
	const landingOpts = [['', 'Ninguna'], ...S.fixedPages.map((p) => [p, `/${p}/ (página del sitio)`]), ...S.pages.map((p) => [p.slug, `/${p.slug}/ · ${(p.es ?? p.en).data.title}`])];
	const custom = o.landing && !landingOpts.some(([v]) => v === o.landing);
	const save = async () => {
		await api('PUT', `game/${g.slug}`, { ...o, ai: o.ai || '', landing: o.landing?.trim() || '' });
		if (g.store.source === 'itch' && src && (src.entry.repo ?? '') !== draft.repo) {
			const next = clone(S.sources);
			next.itch[src.i] = { ...src.entry, repo: draft.repo.trim() };
			await api('PUT', 'sources', next);
		}
		dirty = false; draft = null;
		await reload();
		toast('Guardado');
	};
	const authorship = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
	const drawAuthorship = () => authorship.replaceChildren(
		...o.authorship.map((a, i) => h('div.row', {},
			select(AREAS, a.area, (v) => set(a, 'area', v)), select(WHO, a.who, (v) => set(a, 'who', v)),
			text(a, 'note.es', { placeholder: 'Nota (es)' }), text(a, 'note.en', { placeholder: 'Note (en)' }),
			h('button.link', { onclick: () => { o.authorship.splice(i, 1); touch(); drawAuthorship(); } }, 'Quitar'))),
		h('div', {}, h('button', { onclick: () => { o.authorship.push({ area: 'code', who: 'me', note: { es: '', en: '' } }); touch(); drawAuthorship(); } }, '+ Área'))
	);
	drawAuthorship();
	const editor = h('div.editor', {},
		h('div.bar', {}, h('h1.grow', {}, g.store.title), h('button.primary', { id: 'save', onclick: () => save().catch((e) => toast(e.message, true)) }, 'Guardar')),
		h('div.bar', { style: 'color:var(--muted)' }, h('a', { href: g.store.url, target: '_blank' }, `${STORES[g.store.source]} ↗`), g.store.jam && h('span', {}, `· ${g.store.jam}`), h('span', {}, `· datos del ${g.store.synced_at?.slice(0, 10)}`)),
		field('Visibilidad', seg('show', SHOW, o.show, (v) => set(o, 'show', v)), 'Destacado sale en el primer pantallazo de la home (varios hacen un carrusel) y primero en su lista. Oculto no sale en ningún lado.'),
		field('Uso de IA', seg('ai', AI, o.ai, (v) => set(o, 'ai', v)), 'Vibe-coded va al Lab, sea de la tienda que sea.'),
		h('fieldset', {}, h('legend', {}, 'Texto propio'), h('span.hint', {}, 'Vacío: se usa el de la tienda (gris).'),
			h('div.two', {}, Object.entries(LANGS).map(([l, n]) => field(n, area(o, `summary.${l}`, { placeholder: g.store.text?.[l] || g.store.text?.en || '' }))))),
		h('fieldset', {}, h('legend', {}, 'Mi rol'), h('div.two', {}, Object.entries(LANGS).map(([l, n]) => field(n, text(o, `role.${l}`))))),
		h('fieldset', {}, h('legend', {}, 'Quién hizo qué'), authorship),
		h('fieldset', {}, h('legend', {}, 'Páginas'),
			field('Landing page', select([...landingOpts, ['__custom', 'Otro link https://…']], custom ? '__custom' : o.landing, (v) => { set(o, 'landing', v === '__custom' ? 'https://' : v); render(); }), 'La ficha muestra «Página del proyecto».'),
			custom && field('Link', text(o, 'landing', { placeholder: 'https://…', type: 'url' })),
			h('div.hint', {}, linked.length ? ['Linkeadas desde su ficha: ', ...linked.map((p) => h('button.link', { onclick: () => go('pages', p.slug), style: 'margin-right:10px' }, `/${p.slug}/`))] : 'Ninguna página de contenido apunta a este proyecto. ',
				h('button.link', { onclick: () => newDoc('pages', g.store.title, { project: g.slug }) }, 'Crear una'))),
		g.store.source === 'itch' && src && field('Código en GitHub', h('input', { value: draft.repo, placeholder: 'usuario/repo', oninput: (e) => { draft.repo = e.target.value; touch(); } }), 'Opcional: la ficha lo linkea y el repo no se repite en Proyectos.'),
		src && h('div', {}, h('button.danger', { onclick: async () => {
			if (!confirm(`¿Sacar «${g.store.title}» del sitio? Sus datos e imágenes se borran la próxima vez que traigas datos de las tiendas.`)) return;
			const next = clone(S.sources);
			next[g.store.source].splice(src.i, 1);
			await api('PUT', 'sources', next);
			dirty = false;
			await reload();
			toast('Quitado de la lista de fuentes');
		} }, 'Quitar del sitio'))
	);
	return [list, editor, `/${lang}/games/${g.slug}/`];
}

// ---------- Blog and pages: one file per language, the shared fields kept equal in both.
const SHARED = { blog: ['date', 'tags', 'draft'], pages: ['project', 'draft'] };
function newDoc(kind, title = '', data = {}) {
	if (!leave()) return;
	title = prompt(kind === 'blog' ? 'Título del post' : 'Título de la página', title);
	if (!title) return;
	const slug = slugify(title);
	if (S[kind].some((d) => d.slug === slug) || (kind === 'pages' && S.reserved.includes(slug))) return toast(`Ya existe /${slug}/`, true);
	view = kind; sel = slug; lang = 'es'; dirty = true;
	draft = { slug, isNew: true, es: { data: { title, ...(kind === 'blog' ? { date: today(), description: '', tags: [], draft: true } : { description: '', project: '', draft: true }), ...data }, body: '' } };
	render();
}
function docsView(kind) {
	const docs = [...S[kind]].sort((a, b) => kind === 'blog' ? String((b.es ?? b.en).data.date).localeCompare(String((a.es ?? a.en).data.date)) : a.slug.localeCompare(b.slug));
	const list = h('div.list', {}, h('div.list-head', {}, h('button.primary', { onclick: () => newDoc(kind) }, kind === 'blog' ? '+ Nuevo post' : '+ Nueva página')),
		docs.map((d) => { const m = (d.es ?? d.en).data; return h('button.item', { 'aria-current': String(sel === d.slug), onclick: () => go(kind, d.slug) },
			h('span', { style: 'min-width:0' }, h('div.t', {}, m.title), h('div.s', {}, kind === 'blog' ? String(m.date ?? '') : `/${d.slug}/`, m.draft && h('span.tag.off', {}, 'borrador'), Object.keys(LANGS).map((l) => d[l] && h('span.tag', {}, l))))); }),
		!docs.length && h('div.empty', {}, 'Nada todavía.'));
	const doc = S[kind].find((d) => d.slug === sel);
	if (!doc && !draft?.isNew) return [list, h('div.empty', {}, kind === 'blog' ? 'Elegí un post o creá uno.' : 'Las páginas se publican en /es/<nombre>/ y /en/<nombre>/: landings y todo lo que no es un post.')];
	draft ??= clone(doc);
	if (!draft[lang]) lang = draft.es ? 'es' : 'en';
	const d = draft[lang];
	const shared = (k, v) => { for (const l of Object.keys(LANGS)) if (draft[l]) draft[l].data[k] = v; touch(); };
	const save = async () => {
		await api('PUT', `${kind}/${draft.slug}`, { es: draft.es, en: draft.en });
		dirty = false; draft = null;
		await reload();
		toast('Guardado');
	};
	const body = area(d, 'body', { className: 'body', placeholder: 'Markdown' });
	const upload = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: async (e) => {
		const f = e.target.files[0];
		if (!f) return;
		const data = btoa(Array.from(new Uint8Array(await f.arrayBuffer()), (b) => String.fromCharCode(b)).join(''));
		try {
			const { url } = await api('POST', 'media', { name: f.name, data });
			const md = `![${f.name.replace(/\.\w+$/, '')}](${url})`;
			body.setRangeText(md, body.selectionStart, body.selectionEnd, 'end');
			set(d, 'body', body.value);
		} catch (err) { toast(err.message, true); }
	} });
	const path = kind === 'blog' ? `/${lang}/blog/${draft.slug}/` : `/${lang}/${draft.slug}/`;
	const editor = h('div.editor', {},
		h('div.bar', {}, h('h1.grow', {}, d.data.title || '(sin título)'), h('button.primary', { id: 'save', onclick: () => save().catch((e) => toast(e.message, true)) }, 'Guardar')),
		h('div.hint', {}, path, draft.isNew && ' · nuevo, todavía sin guardar'),
		h('div.tabs', { role: 'tablist' }, Object.entries(LANGS).map(([l, n]) => draft[l]
			? h('button', { role: 'tab', 'aria-selected': String(lang === l), onclick: () => { lang = l; render(); } }, n)
			: h('button', { onclick: () => { draft[l] = { data: { ...clone(d.data), title: '', description: '' }, body: '' }; lang = l; touch(); render(); } }, `+ ${n}`))),
		field('Título', text(d.data, 'title', { oninput: (e) => { set(d.data, 'title', e.target.value); $('h1').textContent = e.target.value; } })),
		field('Bajada', area(d.data, 'description', { rows: 2 }), 'Debajo del título y en buscadores y redes.'),
		h('div.two', {},
			kind === 'blog' && field('Fecha', h('input', { type: 'date', value: String(d.data.date ?? '').slice(0, 10), onchange: (e) => shared('date', e.target.value) })),
			kind === 'blog' && field('Tags', h('input', { value: (d.data.tags ?? []).join(', '), onchange: (e) => shared('tags', e.target.value.split(',').map((s) => s.trim()).filter(Boolean)) }), 'Separados por comas.'),
			kind === 'pages' && field('Proyecto', select([['', 'Ninguno'], ...[...S.games].sort((a, b) => a.store.title.localeCompare(b.store.title)).map((g) => [g.slug, g.store.title])], d.data.project, (v) => shared('project', v)), 'Su ficha linkea a esta página.')),
		h('label.check', {}, h('input', { type: 'checkbox', checked: !!d.data.draft, onchange: (e) => shared('draft', e.target.checked) }), 'Borrador', h('span.hint', {}, '(solo se ve en la vista previa, no se publica)')),
		h('label', {}, h('span.bar', {}, h('span.grow', {}, 'Texto'), h('button', { onclick: () => upload.click() }, 'Insertar imagen')), body, upload),
		!draft.isNew && h('div.bar', {},
			draft.es && draft.en && h('button.danger', { onclick: async () => { if (!confirm(`¿Borrar la versión en ${LANGS[lang]}?`)) return; await api('DELETE', `${kind}/${draft.slug}?lang=${lang}`); dirty = false; draft = null; await reload(); } }, `Borrar versión en ${LANGS[lang]}`),
			h('button.danger', { onclick: async () => { if (!confirm(`¿Borrar «${d.data.title}» en todos los idiomas?`)) return; await api('DELETE', `${kind}/${draft.slug}`); dirty = false; go(kind); await reload(); } }, 'Borrar todo'))
	);
	return [list, editor, path];
}

// ---------- Site: contact links and wikis
function siteView() {
	draft ??= { profile: clone(S.profile), wikis: clone(S.sources.wikis ?? []) };
	const links = draft.profile.links;
	const box = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
	const move = (i, j) => { [links[i], links[j]] = [links[j], links[i]]; touch(); draw(); };
	const draw = () => box.replaceChildren(...links.map((l, i) => h('div.row.link', {},
		text(l, 'label', { placeholder: 'Texto', 'aria-label': 'Texto' }), text(l, 'url', { placeholder: 'https://… o mailto:…', 'aria-label': 'URL' }),
		h('button', { disabled: i === 0, onclick: () => move(i, i - 1), 'aria-label': 'Subir' }, '↑'), h('button', { disabled: i === links.length - 1, onclick: () => move(i, i + 1), 'aria-label': 'Bajar' }, '↓'),
		h('button.link', { onclick: () => { links.splice(i, 1); touch(); draw(); } }, 'Quitar'))),
		h('div', {}, h('button', { onclick: () => { links.push({ label: '', url: '' }); touch(); draw(); } }, '+ Link')));
	draw();
	const save = async () => {
		if (links.some((l) => !l.label.trim() || !l.url.trim())) throw new Error('Cada link necesita texto y URL');
		await api('PUT', 'profile', draft.profile);
		await api('PUT', 'sources', { ...S.sources, wikis: draft.wikis.map((w) => w.trim()).filter(Boolean) });
		dirty = false; draft = null;
		await reload();
		toast('Guardado');
	};
	const editor = h('div.editor', {},
		h('div.bar', {}, h('h1.grow', {}, 'Sitio'), h('button.primary', { id: 'save', onclick: () => save().catch((e) => toast(e.message, true)) }, 'Guardar')),
		h('fieldset', {}, h('legend', {}, 'Links de contacto'), h('span.hint', {}, 'En el pie de cada página y en /links/, en este orden. El de itch.io también va en el primer pantallazo.'), box),
		h('fieldset', {}, h('legend', {}, 'Wikis'), h('span.hint', {}, 'Una por línea: usuario/repo usa su carpeta docs/; para otra carpeta, su link github.com/usuario/repo/tree/main/carpeta. Se publica en /wiki/<repo>/ al traer datos de las tiendas.'),
			h('textarea', { rows: 4, value: draft.wikis.join('\n'), oninput: (e) => { draft.wikis = e.target.value.split('\n'); touch(); } }))
	);
	return [h('div.list', {}, h('div.empty', {}, 'Los textos fijos del sitio (títulos, menú) están en src/i18n.ts.')), editor, `/${lang}/links/`];
}

// ---------- Publish
function publishView() {
	const runIt = (label, path, body) => async (e) => {
		if (busy) return;
		busy = label;
		e.target.disabled = true;
		e.target.textContent = `${label}…`;
		try {
			const r = await api('POST', path, body);
			lastLog = r.log;
			toast(r.ok ? `${label}: listo` : `${label}: falló, mirá el registro`, !r.ok);
		} catch (err) { toast(err.message, true); }
		busy = '';
		await reload();
	};
	const msg = h('input', { placeholder: 'content: update from admin', 'aria-label': 'Mensaje del commit' });
	const editor = h('div.editor', {},
		h('h1', {}, 'Publicar'),
		h('fieldset', {}, h('legend', {}, 'Datos de las tiendas'),
			h('span.hint', {}, 'Trae títulos, imágenes y textos de Steam, itch.io, GitHub y el Asset Library, y las wikis; saca lo que quitaste de la lista. También corre solo en cada deploy y todos los días.'),
			h('div', {}, h('button', { onclick: runIt('Traer datos de las tiendas', 'sync') }, 'Traer datos de las tiendas'))),
		h('fieldset', {}, h('legend', {}, `Cambios sin publicar (${S.changes.length})`),
			S.changes.length ? h('pre.log', {}, S.changes.join('\n')) : h('span.hint', {}, 'Todo publicado.'),
			field('Mensaje', msg),
			h('div', {}, h('button.primary', { disabled: !S.changes.length, onclick: (e) => runIt('Publicar', 'publish', { message: msg.value })(e) }, 'Publicar')),
			h('span.hint', {}, 'Hace commit de content/ y public/ y lo sube a main; el sitio se actualiza en unos minutos.')),
		lastLog && h('fieldset', {}, h('legend', {}, 'Registro'), h('pre.log', {}, lastLog))
	);
	return [h('div.list', {}, h('div.empty', {}, 'Guardar escribe los archivos en tu equipo. Publicar los sube.')), editor, `/${lang}/`];
}

reload().catch((e) => { document.body.textContent = `No pude leer el contenido: ${e.message}`; });
</script>
